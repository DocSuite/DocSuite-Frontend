<section class="rounded-xl border border-surface-200 bg-white p-5">
  <div class="mb-4 flex items-start justify-between gap-4">
    <div>
      <h2 class="text-base font-semibold tracking-normal text-surface-900">Audio de reunión</h2>
      <p class="mt-1 text-sm text-slate-600">Sube una grabación para iniciar la transcripción y generación del acta.</p>
    </div>
    <i class="pi pi-microphone text-xl text-brand-600"></i>
  </div>

  <ng-container *ngIf="fileInfo; else emptyState">
    <div class="rounded-lg border border-surface-200 bg-surface-50 p-4">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg border border-surface-200 bg-white text-brand-600">
          <i class="pi pi-volume-up"></i>
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-semibold text-surface-900">{{ fileInfo.name }}</p>
          <p class="mt-1 text-xs font-medium uppercase tracking-normal text-slate-500">
            {{ fileInfo.sizeLabel }} · {{ fileInfo.extension }}
          </p>
        </div>
        <button
          class="flex h-9 w-9 items-center justify-center rounded-lg border border-surface-200 bg-white text-slate-500 transition-colors hover:text-red-600 disabled:cursor-not-allowed disabled:text-slate-300"
          type="button"
          [disabled]="disabled"
          (click)="fileRemoved.emit()"
          aria-label="Quitar audio"
        >
          <i class="pi pi-times"></i>
        </button>
      </div>
    </div>
  </ng-container>

  <ng-template #emptyState>
    <label class="block cursor-pointer rounded-xl border border-dashed border-slate-300 bg-surface-50 p-6 transition-colors hover:border-brand-600 hover:bg-white">
      <input class="sr-only" type="file" [accept]="accept" [disabled]="disabled" (change)="onFileChange($event)" />
      <span class="flex items-center gap-4">
        <span class="flex h-12 w-12 items-center justify-center rounded-lg border border-surface-200 bg-white text-brand-600">
          <i class="pi pi-upload text-lg"></i>
        </span>
        <span class="min-w-0">
          <span class="block text-sm font-semibold text-surface-900">Seleccionar archivo de audio</span>
          <span class="mt-1 block text-sm text-slate-600">{{ allowedText }}</span>
        </span>
      </span>
    </label>
  </ng-template>
</section>
