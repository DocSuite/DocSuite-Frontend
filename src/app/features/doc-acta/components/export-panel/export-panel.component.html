<section class="rounded-xl border border-surface-200 bg-white p-5">
  <div class="mb-4 flex items-start justify-between gap-4">
    <div>
      <h2 class="text-base font-semibold tracking-normal text-surface-900">Exportacion</h2>
      <p class="mt-1 text-sm text-slate-600">Acciones disponibles cuando el acta tenga contenido consultable.</p>
    </div>
    <i class="pi pi-download text-xl text-brand-600"></i>
  </div>

  <div class="grid gap-3 sm:grid-cols-3">
    <button
      class="flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-3 text-sm font-semibold text-slate-500 disabled:cursor-not-allowed disabled:bg-surface-50"
      type="button"
      [disabled]="!actaId"
    >
      <i class="pi pi-copy"></i>
      Copiar
    </button>
    <button
      class="flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-3 text-sm font-semibold text-slate-500 disabled:cursor-not-allowed disabled:bg-surface-50"
      type="button"
      [disabled]="!actaId"
    >
      <i class="pi pi-file-pdf"></i>
      PDF
    </button>
    <button
      class="flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-3 text-sm font-semibold text-slate-500 disabled:cursor-not-allowed disabled:bg-surface-50"
      type="button"
      [disabled]="!actaId"
    >
      <i class="pi pi-file-word"></i>
      DOCX
    </button>
  </div>
</section>
