<section class="rounded-xl border border-surface-200 bg-white p-5">
  <div class="mb-4 flex items-start justify-between gap-4">
    <div>
      <h2 class="text-base font-semibold tracking-normal text-surface-900">Exportacion</h2>
      <p class="mt-1 text-sm text-slate-600">Copia o descarga la transcripcion y el acta generada.</p>
    </div>
    <i class="pi pi-download text-xl text-brand-600"></i>
  </div>

  <p *ngIf="feedback()" class="mb-4 rounded-lg border border-surface-200 bg-surface-50 px-3 py-2 text-sm font-semibold text-slate-700">
    {{ feedback() }}
  </p>

  <div class="grid gap-4 xl:grid-cols-2">
    <section class="rounded-lg border border-surface-200 bg-surface-50 p-4">
      <h3 class="text-sm font-semibold text-surface-900">Transcripcion</h3>
      <div class="mt-3 grid gap-3 sm:grid-cols-2">
        <button
          class="flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
          type="button"
          [disabled]="!acta?.transcription"
          aria-label="Copiar transcripcion"
          (click)="copyTranscription()"
        >
          <i class="pi pi-copy"></i>
          Copiar
        </button>
        <button
          class="flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
          type="button"
          [disabled]="!acta?.transcription"
          aria-label="Descargar transcripcion en PDF"
          (click)="downloadTranscriptionPdf()"
        >
          <i class="pi pi-file-pdf"></i>
          PDF
        </button>
      </div>
    </section>

    <section class="rounded-lg border border-surface-200 bg-surface-50 p-4">
      <h3 class="text-sm font-semibold text-surface-900">Acta</h3>
      <div class="mt-3 grid gap-3 sm:grid-cols-3">
        <button
          class="flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
          type="button"
          [disabled]="!acta?.result"
          aria-label="Copiar acta"
          (click)="copyActa()"
        >
          <i class="pi pi-copy"></i>
          Copiar
        </button>
        <button
          class="flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
          type="button"
          [disabled]="!acta?.result"
          aria-label="Descargar acta en PDF"
          (click)="downloadActaPdf()"
        >
          <i class="pi pi-file-pdf"></i>
          PDF
        </button>
        <button
          class="flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-3 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
          type="button"
          [disabled]="!acta || isDownloadingDocx()"
          aria-label="Descargar acta en DOCX"
          (click)="downloadActaDocx()"
        >
          <i class="pi" [ngClass]="isDownloadingDocx() ? 'pi-spin pi-spinner' : 'pi-file-word'"></i>
          DOCX
        </button>
      </div>
    </section>
  </div>
</section>
