<section class="rounded-lg border border-surface-200 bg-white p-4">
  <div class="mb-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="text-sm font-semibold text-surface-900">Tabla de tareas</h3>
      <p class="mt-1 text-xs text-slate-500">Responsables, fechas y estado de seguimiento.</p>
    </div>
    <button
      class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
      type="button"
      [disabled]="isSaving"
      aria-label="Agregar tarea al acta"
      (click)="addTask()"
    >
      <i class="pi pi-plus"></i>
      Agregar tarea
    </button>
  </div>

  <div class="space-y-3">
    <div
      *ngFor="let task of tasks; let index = index; trackBy: trackByIndex"
      class="grid gap-3 rounded-lg border border-surface-200 bg-surface-50 p-3 xl:grid-cols-[1.4fr_1fr_0.8fr_auto_auto]"
    >
      <input
        class="rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand-600"
        type="text"
        placeholder="Descripcion"
        [(ngModel)]="task.description"
        [disabled]="isSaving"
        [attr.aria-label]="'Descripcion de la tarea ' + (index + 1)"
        (ngModelChange)="onTaskChange()"
      />
      <input
        class="rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand-600"
        type="text"
        placeholder="Responsable"
        [(ngModel)]="task.owner"
        [disabled]="isSaving"
        [attr.aria-label]="'Responsable de la tarea ' + (index + 1)"
        (ngModelChange)="onTaskChange()"
      />
      <input
        class="rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand-600"
        type="text"
        placeholder="Fecha"
        [(ngModel)]="task.due_date"
        [disabled]="isSaving"
        [attr.aria-label]="'Fecha de la tarea ' + (index + 1)"
        (ngModelChange)="onTaskChange()"
      />
      <label class="flex items-center gap-2 text-sm font-medium text-slate-600">
        <input
          class="h-4 w-4 rounded border-surface-200 text-brand-600"
          type="checkbox"
          [(ngModel)]="task.done"
          [disabled]="isSaving"
          [attr.aria-label]="'Marcar tarea ' + (index + 1) + ' como hecha'"
          (ngModelChange)="onTaskChange()"
        />
        Hecho
      </label>
      <button
        class="flex h-9 w-9 items-center justify-center rounded-lg border border-surface-200 bg-white text-slate-500 transition-colors hover:text-red-600 disabled:cursor-not-allowed disabled:text-slate-300"
        type="button"
        [disabled]="isSaving"
        (click)="removeTaskRequest.emit(index)"
        aria-label="Quitar tarea"
      >
        <i class="pi pi-times"></i>
      </button>
    </div>

    <p *ngIf="!tasks.length" class="rounded-lg border border-surface-200 bg-surface-50 px-3 py-3 text-sm text-slate-500">
      No hay tareas registradas.
    </p>
  </div>
</section>
