<section class="rounded-xl border border-surface-200 bg-white p-5">
  <div class="mb-4 flex items-start justify-between gap-4">
    <div>
      <h2 class="text-base font-semibold tracking-normal text-surface-900">Acta generada</h2>
      <p class="mt-1 text-sm text-slate-600">Resultado listo para revision docente.</p>
    </div>
    <i class="pi pi-file-edit text-xl text-brand-600"></i>
  </div>

  <div class="rounded-lg border border-surface-200 bg-surface-50 p-4">
    <ng-container *ngIf="isCompleted; else pendingState">
      <div class="mb-4 flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-600 text-white">
          <i class="pi pi-check"></i>
        </span>
        <div>
          <p class="text-sm font-semibold text-surface-900">Acta creada correctamente</p>
          <p class="mt-1 text-xs font-medium uppercase text-slate-500">ID {{ job?.acta_id }}</p>
        </div>
      </div>

      <article class="max-h-[28rem] overflow-auto rounded-lg border border-surface-200 bg-white p-4">
        <ng-container *ngIf="resultParagraphs.length; else loadingActa">
          <p *ngFor="let paragraph of resultParagraphs" class="mb-4 text-sm leading-6 text-slate-700 last:mb-0">
            {{ paragraph }}
          </p>
        </ng-container>

        <ng-template #loadingActa>
          <p class="text-sm leading-6 text-slate-500">Cargando contenido del acta.</p>
        </ng-template>
      </article>
    </ng-container>

    <ng-template #pendingState>
      <p class="text-sm leading-6 text-slate-500">
        El acta aparecera cuando el procesamiento llegue al 100%.
      </p>
    </ng-template>
  </div>
</section>
