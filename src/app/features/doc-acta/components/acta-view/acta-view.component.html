<section class="rounded-xl border border-surface-200 bg-white p-5">
  <div class="mb-4 flex items-start justify-between gap-4">
    <div>
      <h2 class="text-base font-semibold tracking-normal text-surface-900">Acta generada</h2>
      <p class="mt-1 text-sm text-slate-600">Resultado editable para revision docente.</p>
    </div>
    <i class="pi pi-file-edit text-xl text-brand-600"></i>
  </div>

  <div class="rounded-lg border border-surface-200 bg-surface-50 p-4">
    <ng-container *ngIf="isCompleted; else pendingState">
      <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-3">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-brand-600 text-white">
            <i class="pi pi-check"></i>
          </span>
          <div>
            <p class="text-sm font-semibold text-surface-900">Acta creada correctamente</p>
            <p class="mt-1 text-xs font-medium uppercase text-slate-500">ID {{ job?.acta_id }}</p>
          </div>
        </div>

        <div *ngIf="acta && !isEditing" class="flex flex-col gap-2 sm:flex-row">
          <button
            class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
            type="button"
            [disabled]="isRegenerating"
            aria-label="Regenerar acta"
            (click)="regenerateActa.emit()"
          >
            <i class="pi" [ngClass]="isRegenerating ? 'pi-spin pi-spinner' : 'pi-refresh'"></i>
            Regenerar
          </button>
          <button
            class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
            type="button"
            [disabled]="isRegenerating"
            aria-label="Editar acta generada"
            (click)="startEditing()"
          >
            <i class="pi pi-pencil"></i>
            Editar
          </button>
        </div>
      </div>

      <ng-container *ngIf="isEditing; else readMode">
        <div class="space-y-4">
          <label class="block">
            <span class="mb-2 block text-sm font-semibold text-surface-900">Contenido del acta</span>
            <textarea
              id="docacta-acta-draft"
              class="min-h-80 w-full resize-y rounded-lg border border-surface-200 bg-white px-3 py-3 text-sm leading-6 text-surface-900 outline-none transition-colors focus:border-brand-600"
              [(ngModel)]="draftResult"
              [disabled]="isSaving"
              aria-describedby="docacta-acta-help docacta-acta-draft-status"
              aria-label="Editar contenido del acta"
              (ngModelChange)="onDraftChange()"
            ></textarea>
            <span id="docacta-acta-help" class="mt-2 block text-xs text-slate-500">
              Los cambios se conservan como borrador local hasta que pulses Guardar cambios.
            </span>
            <span
              *ngIf="draftStatus"
              id="docacta-acta-draft-status"
              class="mt-2 block text-xs font-semibold text-slate-600"
              role="status"
              aria-live="polite"
            >
              {{ draftStatus }}
            </span>
          </label>

          <app-acta-task-editor
            [(tasks)]="draftTasks"
            [isSaving]="isSaving"
            (draftChange)="onDraftChange()"
            (removeTaskRequest)="removeTask($event)"
          />

          <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
            <button
              class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600 disabled:cursor-not-allowed disabled:text-slate-300"
              type="button"
              [disabled]="isSaving"
              aria-label="Cancelar edicion del acta"
              title="Cancelar edicion (Esc)"
              (click)="cancelEditing()"
            >
              Cancelar
            </button>
            <button
              class="inline-flex items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-brand-700 disabled:cursor-not-allowed disabled:bg-slate-300"
              type="button"
              [disabled]="isSaving || !draftResult.trim()"
              aria-label="Guardar cambios del acta"
              title="Guardar cambios (Ctrl+S)"
              (click)="saveChanges()"
            >
              <i class="pi" [ngClass]="isSaving ? 'pi-spin pi-spinner' : 'pi-save'"></i>
              Guardar cambios
            </button>
          </div>
        </div>
      </ng-container>

      <ng-template #readMode>
        <article class="max-h-[calc(100vh-13rem)] overflow-auto rounded-lg border border-surface-200 bg-white px-6 py-6">
          <app-acta-renderer [content]="acta?.result || ''" />
        </article>
      </ng-template>
    </ng-container>

    <ng-template #pendingState>
      <p class="text-sm leading-6 text-slate-500">
        El acta aparecera cuando el procesamiento llegue al 100%.
      </p>
    </ng-template>
  </div>
</section>
