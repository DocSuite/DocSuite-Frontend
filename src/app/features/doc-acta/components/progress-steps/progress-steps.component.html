<section class="rounded-xl border border-surface-200 bg-white p-5">
  <div class="mb-4 flex items-center justify-between gap-4">
    <div>
      <h2 class="text-base font-semibold tracking-normal text-surface-900">Progreso</h2>
      <p class="mt-1 text-sm text-slate-600">{{ job?.message || 'Esperando audio' }}</p>
    </div>
    <span class="rounded-full border border-surface-200 bg-surface-50 px-3 py-1 text-xs font-semibold uppercase text-slate-600">
      {{ job?.status || 'idle' }}
    </span>
  </div>

  <div class="mb-5 h-2 overflow-hidden rounded-full bg-surface-100">
    <div class="h-full rounded-full bg-brand-600 transition-all" [style.width.%]="job?.progress || 0"></div>
  </div>

  <ol class="space-y-3">
    <li *ngFor="let step of steps" class="flex items-center gap-3">
      <span
        class="flex h-8 w-8 items-center justify-center rounded-full border text-sm"
        [ngClass]="isDone(step.progress) ? 'border-brand-600 bg-brand-600 text-white' : 'border-surface-200 bg-white text-slate-400'"
      >
        <i class="pi" [ngClass]="step.icon"></i>
      </span>
      <span class="text-sm font-medium" [ngClass]="isDone(step.progress) ? 'text-surface-900' : 'text-slate-500'">
        {{ step.label }}
      </span>
    </li>
  </ol>

  <p *ngIf="job?.error" class="mt-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-700">
    {{ job?.error }}
  </p>
</section>
