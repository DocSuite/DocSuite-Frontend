<main class="min-h-screen bg-surface-50 p-4 text-surface-900 sm:p-6 lg:p-8">
  <section class="mx-auto max-w-6xl">
    <app-page-header
      eyebrow="DocSuite / Auditorias"
      title="Auditorias"
      description="Trazabilidad de acciones relevantes dentro de la plataforma."
    >
      <span pageHeaderActions class="inline-flex items-center gap-2 rounded-full border border-surface-200 bg-white px-3 py-1 text-xs font-semibold text-slate-600">
        <i class="pi pi-shield"></i>
        {{ records().length }} eventos
      </span>
    </app-page-header>

    <div class="mb-5 flex justify-end">
      <button
        class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600"
        type="button"
        (click)="loadAudits()"
      >
        <i class="pi pi-refresh"></i>
        Actualizar
      </button>
    </div>

    <app-alert-message [message]="errorMessage()" />

    <section class="overflow-hidden rounded-xl border border-surface-200 bg-white">
      <div class="grid grid-cols-[1.2fr_1.2fr_0.8fr_0.8fr_0.7fr] gap-4 border-b border-surface-200 bg-surface-50 px-5 py-3 text-xs font-semibold uppercase text-slate-500">
        <span>Evento</span>
        <span>Usuario</span>
        <span>Modulo</span>
        <span>Fecha</span>
        <span>Estado</span>
      </div>

      <app-loading-state [visible]="isLoading()" message="Cargando auditorias." containerClass="px-5 py-6" />

      <article *ngFor="let record of records()" class="grid grid-cols-[1.2fr_1.2fr_0.8fr_0.8fr_0.7fr] gap-4 border-b border-surface-200 px-5 py-4 text-sm last:border-b-0">
        <span class="font-semibold text-surface-900">{{ record.event }}</span>
        <span class="truncate text-slate-600">{{ record.user_email }}</span>
        <span class="text-slate-600">{{ record.module }}</span>
        <span class="text-slate-500">{{ formatDate(record.created_at) }}</span>
        <span class="font-semibold text-surface-900">{{ statusLabel(record.status) }}</span>
      </article>

      <p *ngIf="!isLoading() && !records().length" class="px-5 py-6 text-sm text-slate-500">
        Todavia no hay eventos de auditoria.
      </p>
    </section>
  </section>
</main>
