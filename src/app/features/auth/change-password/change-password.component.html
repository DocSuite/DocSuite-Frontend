<main class="min-h-screen bg-surface-50 text-surface-900">
  <section class="flex min-h-screen items-center justify-center px-6 py-10">
    <div class="w-full max-w-md rounded-xl border border-surface-200 bg-white p-6">
      <div class="mb-6 flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg border border-surface-200 bg-surface-50 text-brand-600">
          <i class="pi pi-lock"></i>
        </div>
        <div>
          <p class="text-base font-semibold text-surface-900">Actualizar contrasena</p>
          <p class="text-xs font-medium text-slate-500">{{ isActivationChange() ? 'Requerido para activar tu cuenta' : 'Usa tu contrasena actual' }}</p>
        </div>
      </div>

      <div *ngIf="isActivationChange()" class="mb-5 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm leading-6 text-amber-700">
        Tu contrasena temporal es tu DNI. Usala solo para activar la cuenta y luego guarda una contrasena nueva.
      </div>

      <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-surface-800">{{ isActivationChange() ? 'Contrasena temporal' : 'Contrasena actual' }}</span>
          <span class="flex h-11 items-center rounded-lg border border-surface-200 bg-white px-3 transition-colors focus-within:border-brand-600">
            <input
              class="min-w-0 flex-1 bg-transparent text-sm text-surface-900 outline-none"
              [type]="showCurrentPassword() ? 'text' : 'password'"
              formControlName="current_password"
              autocomplete="current-password"
            />
            <button
              class="ml-2 text-slate-500 transition-colors hover:text-brand-600"
              type="button"
              [attr.aria-label]="showCurrentPassword() ? 'Ocultar contrasena actual' : 'Mostrar contrasena actual'"
              (click)="toggleCurrentPassword()"
            >
              <i class="pi" [ngClass]="showCurrentPassword() ? 'pi-eye-slash' : 'pi-eye'"></i>
            </button>
          </span>
        </label>

        <label class="block">
          <span class="mb-2 block text-sm font-medium text-surface-800">Nueva contrasena</span>
          <span class="flex h-11 items-center rounded-lg border border-surface-200 bg-white px-3 transition-colors focus-within:border-brand-600">
            <input
              class="min-w-0 flex-1 bg-transparent text-sm text-surface-900 outline-none"
              [type]="showNewPassword() ? 'text' : 'password'"
              formControlName="new_password"
              autocomplete="new-password"
            />
            <button
              class="ml-2 text-slate-500 transition-colors hover:text-brand-600"
              type="button"
              [attr.aria-label]="showNewPassword() ? 'Ocultar nueva contrasena' : 'Mostrar nueva contrasena'"
              (click)="toggleNewPassword()"
            >
              <i class="pi" [ngClass]="showNewPassword() ? 'pi-eye-slash' : 'pi-eye'"></i>
            </button>
          </span>
        </label>

        <label class="block">
          <span class="mb-2 block text-sm font-medium text-surface-800">Confirmar contrasena</span>
          <span class="flex h-11 items-center rounded-lg border border-surface-200 bg-white px-3 transition-colors focus-within:border-brand-600">
            <input
              class="min-w-0 flex-1 bg-transparent text-sm text-surface-900 outline-none"
              [type]="showConfirmPassword() ? 'text' : 'password'"
              formControlName="confirm_password"
              autocomplete="new-password"
            />
            <button
              class="ml-2 text-slate-500 transition-colors hover:text-brand-600"
              type="button"
              [attr.aria-label]="showConfirmPassword() ? 'Ocultar confirmacion' : 'Mostrar confirmacion'"
              (click)="toggleConfirmPassword()"
            >
              <i class="pi" [ngClass]="showConfirmPassword() ? 'pi-eye-slash' : 'pi-eye'"></i>
            </button>
          </span>
        </label>

        <div *ngIf="errorMessage()" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-700">
          {{ errorMessage() }}
        </div>

        <button
          class="flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 text-sm font-semibold text-white transition-colors hover:bg-brand-700 disabled:cursor-not-allowed disabled:bg-slate-300"
          type="submit"
          [disabled]="isSubmitting()"
        >
          <i class="pi" [ngClass]="isSubmitting() ? 'pi-spin pi-spinner' : 'pi-check'"></i>
          <span>{{ isSubmitting() ? 'Guardando' : 'Guardar contrasena' }}</span>
        </button>
      </form>
    </div>
  </section>
</main>
