<main class="min-h-screen bg-surface-50 text-surface-900">
  <section class="flex min-h-screen items-center justify-center px-6 py-10">
    <div class="w-full max-w-md rounded-xl border border-surface-200 bg-white p-6">
      <div class="mb-6 flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg border border-surface-200 bg-surface-50 text-brand-600">
          <i class="pi pi-envelope"></i>
        </div>
        <div>
          <p class="text-base font-semibold text-surface-900">Restablecer contrasena</p>
          <p class="text-xs font-medium text-slate-500">Recibiras un enlace seguro por correo</p>
        </div>
      </div>

      <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
        <label class="block">
          <span class="mb-2 block text-sm font-medium text-surface-800">Correo institucional</span>
          <span class="relative block">
            <i class="pi pi-envelope pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400"></i>
            <input
              class="h-11 w-full rounded-lg border border-surface-200 bg-white pl-9 pr-3 text-sm text-surface-900 outline-none transition-colors placeholder:text-slate-400 focus:border-brand-600"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="tu.correo@institucion.edu"
            />
          </span>
          <span *ngIf="hasEmailError()" class="mt-1.5 block text-xs font-medium text-red-600">
            Ingresa un correo valido.
          </span>
        </label>

        <div *ngIf="successMessage()" class="rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm font-medium text-emerald-700">
          {{ successMessage() }}
        </div>

        <div *ngIf="errorMessage()" class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm font-medium text-red-700">
          {{ errorMessage() }}
        </div>

        <button
          class="flex h-11 w-full items-center justify-center gap-2 rounded-lg bg-brand-600 px-4 text-sm font-semibold text-white transition-colors hover:bg-brand-700 disabled:cursor-not-allowed disabled:bg-slate-300"
          type="submit"
          [disabled]="isSubmitting()"
        >
          <i class="pi" [ngClass]="isSubmitting() ? 'pi-spin pi-spinner' : 'pi-send'"></i>
          <span>{{ isSubmitting() ? 'Enviando' : 'Enviar enlace' }}</span>
        </button>
      </form>

      <a class="mt-5 inline-flex items-center gap-2 text-sm font-semibold text-brand-600" routerLink="/login">
        <i class="pi pi-arrow-left"></i>
        Volver al login
      </a>
    </div>
  </section>
</main>
