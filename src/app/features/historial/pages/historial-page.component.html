<main class="min-h-screen bg-surface-50 p-4 text-surface-900 sm:p-6 lg:p-8">
  <section class="w-full">
    <app-page-header
      eyebrow="DocSuite / Historial"
      title="Historial"
      description="Actas generadas previamente en DocActa."
    >
      <button
        pageHeaderActions
        class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600"
        type="button"
        (click)="loadHistory()"
      >
        <i class="pi pi-refresh"></i>
        Actualizar
      </button>
    </app-page-header>

    <app-alert-message [message]="errorMessage()" />

    <section class="overflow-hidden rounded-xl border border-surface-200 bg-white">
      <div class="grid grid-cols-[1.4fr_0.8fr_0.8fr_0.7fr_auto] gap-4 border-b border-surface-200 bg-surface-50 px-5 py-3 text-xs font-semibold uppercase text-slate-500">
        <span>Archivo</span>
        <span>Duracion</span>
        <span>Tareas</span>
        <span>Fecha</span>
        <span></span>
      </div>

      <app-loading-state [visible]="isLoading()" message="Cargando historial." containerClass="px-5 py-6" />

      <article
        *ngFor="let acta of actas()"
        class="grid grid-cols-[1.4fr_0.8fr_0.8fr_0.7fr_auto] gap-4 border-b border-surface-200 px-5 py-4 text-sm last:border-b-0"
      >
        <div class="min-w-0">
          <p class="truncate font-semibold text-surface-900">{{ acta.filename }}</p>
          <p class="mt-1 truncate text-xs text-slate-500">{{ acta.id }}</p>
        </div>
        <span class="text-slate-600">{{ formatDuration(acta.duration_seconds) }}</span>
        <span class="text-slate-600">{{ acta.tasks.length }}</span>
        <span class="text-slate-500">{{ formatDate(acta.created_at) }}</span>
        <a
          class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600"
          routerLink="/doc-acta"
          [queryParams]="{ actaId: acta.id }"
        >
          <i class="pi pi-eye"></i>
          Ver
        </a>
      </article>

      <p *ngIf="!isLoading() && !actas().length" class="px-5 py-6 text-sm text-slate-500">
        Todavia no hay actas registradas.
      </p>
    </section>
  </section>
</main>
