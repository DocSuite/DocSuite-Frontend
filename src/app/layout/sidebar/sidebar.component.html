<aside class="flex min-h-screen w-full flex-col border-r border-surface-200 bg-white">
  <div class="border-b border-surface-200 p-4">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-600 text-white">
        <i class="pi pi-folder"></i>
      </div>
      <div>
        <p class="text-sm font-semibold text-surface-900">DocSuite</p>
      </div>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto p-3">
    <section>
      <p class="px-3 pb-2 text-xs font-semibold uppercase text-slate-500">Espacio de trabajo</p>
      <nav class="space-y-1">
        <ng-container *ngFor="let item of visibleWorkspaceItems">
          <a
            *ngIf="!item.disabled; else disabledItem"
            class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition-colors hover:bg-surface-50 hover:text-surface-900"
            [routerLink]="item.route"
            routerLinkActive="bg-surface-100 text-surface-900"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="pi text-sm" [ngClass]="item.icon"></i>
            <span class="min-w-0 flex-1 truncate">{{ item.label }}</span>
            <span *ngIf="item.badge" class="rounded-full border border-surface-200 bg-surface-50 px-2 py-0.5 text-xs font-semibold text-slate-500">
              {{ item.badge }}
            </span>
          </a>

          <ng-template #disabledItem>
            <div class="flex cursor-not-allowed items-center gap-3 rounded-lg px-3 py-2 text-sm font-semibold text-slate-400">
              <i class="pi text-sm" [ngClass]="item.icon"></i>
              <span class="min-w-0 flex-1 truncate">{{ item.label }}</span>
              <span class="rounded-full border border-surface-200 bg-surface-50 px-2 py-0.5 text-xs font-semibold text-slate-500">
                {{ item.badge }}
              </span>
            </div>
          </ng-template>
        </ng-container>
      </nav>
    </section>

  </div>

  <div class="border-t border-surface-200 p-3">
    <div class="mb-3 rounded-xl border border-surface-200 bg-surface-50 p-3">
      <div class="mb-2 flex items-center justify-between text-xs font-semibold text-slate-500">
        <span>Almacenamiento</span>
        <span>3.2 / 10 GB</span>
      </div>
      <div class="h-2 overflow-hidden rounded-full bg-surface-200">
        <div class="h-full w-1/3 rounded-full bg-brand-600"></div>
      </div>
    </div>

    <button
      class="mb-3 flex w-full items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-red-200 hover:bg-red-50 hover:text-red-700"
      type="button"
      (click)="logout()"
    >
      <i class="pi pi-sign-out"></i>
      Cerrar sesion
    </button>

    <a class="flex items-center gap-3 rounded-lg px-2 py-2 transition-colors hover:bg-surface-50" routerLink="/profile">
      <div class="flex h-10 w-10 items-center justify-center rounded-full bg-surface-800 text-sm font-semibold text-white">
        {{ initials }}
      </div>
      <div class="min-w-0 flex-1">
        <p class="truncate text-sm font-semibold text-surface-900">{{ displayName }}</p>
        <p class="truncate text-xs text-slate-500">{{ displayEmail }}</p>
      </div>
      <i class="pi pi-angle-right text-xs text-slate-400"></i>
    </a>
  </div>
</aside>
