<div class="min-h-screen bg-surface-50 text-surface-900 lg:grid lg:grid-cols-[260px_1fr]">
  <app-sidebar class="hidden lg:sticky lg:top-0 lg:block lg:h-screen" />

  <div class="min-w-0">
    <header class="flex items-center justify-between border-b border-surface-200 bg-white px-4 py-3 lg:hidden">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 text-white">
          <i class="pi pi-folder"></i>
        </div>
        <p class="text-sm font-semibold text-surface-900">DocSuite</p>
      </div>

      <button
        class="inline-flex items-center justify-center gap-2 rounded-lg border border-surface-200 bg-white px-3 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-red-200 hover:bg-red-50 hover:text-red-700"
        type="button"
        (click)="logout()"
      >
        <i class="pi pi-sign-out"></i>
        Salir
      </button>
    </header>

    <router-outlet />
  </div>
</div>
