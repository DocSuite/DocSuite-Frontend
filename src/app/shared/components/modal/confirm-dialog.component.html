<div *ngIf="confirmDialogService.request() as request" class="fixed inset-0 z-50 flex items-center justify-center bg-surface-900/40 p-4">
  <section class="w-full max-w-md rounded-xl border border-surface-200 bg-white p-5">
    <div class="mb-4 flex items-start gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg"
        [ngClass]="request.tone === 'danger' ? 'bg-red-50 text-red-700' : 'bg-surface-50 text-brand-600'"
      >
        <i class="pi" [ngClass]="request.tone === 'danger' ? 'pi-exclamation-triangle' : 'pi-info-circle'"></i>
      </span>
      <div>
        <h2 class="text-base font-semibold tracking-normal text-surface-900">{{ request.title }}</h2>
        <p class="mt-1 text-sm leading-6 text-slate-600">{{ request.message }}</p>
      </div>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:justify-end">
      <button
        class="inline-flex items-center justify-center rounded-lg border border-surface-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-brand-600 hover:text-brand-600"
        type="button"
        (click)="confirmDialogService.close(false)"
      >
        {{ request.cancelLabel }}
      </button>
      <button
        class="inline-flex items-center justify-center rounded-lg px-4 py-2 text-sm font-semibold text-white transition-colors"
        [ngClass]="request.tone === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-brand-600 hover:bg-brand-700'"
        type="button"
        (click)="confirmDialogService.close(true)"
      >
        {{ request.confirmLabel }}
      </button>
    </div>
  </section>
</div>
