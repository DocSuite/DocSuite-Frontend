<header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <p *ngIf="eyebrow" class="text-sm font-medium text-slate-500">{{ eyebrow }}</p>
    <h1 class="mt-2 text-2xl font-semibold tracking-normal text-surface-900">{{ title }}</h1>
    <p *ngIf="description" class="mt-2 text-sm text-slate-600">{{ description }}</p>
  </div>

  <ng-content select="[pageHeaderActions]" />
</header>
